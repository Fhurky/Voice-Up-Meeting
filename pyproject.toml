[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voiceup"
version = "0.1.0"
description = "Local speaker identity memory across meeting recordings"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "soundfile>=0.13,<0.14"]

[project.optional-dependencies]
ml = ["torch==2.8.0", "torchaudio==2.8.0", "speechbrain==1.1.1", "silero-vad==6.2.1", "huggingface-hub>=0.28.1,<2"]
diarization = ["voiceup[ml]", "pyannote.audio==4.0.7", "torchcodec==0.7.0"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<0.14"]

[project.scripts]
voiceup = "voiceup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
