schema_version: "1.0"
kind: ClientCapabilityMatrix
as_of: "2026-08-18"
status: research

contract:
  schema_version: "1.0"
  schema_path: agent-platform/agent-contract.schema.json

runtime_candidate_inventory:
  schema_path: agent-platform/runtime-candidate.schema.json
  data_path: agent-platform/conformance/candidates/macos-arm64-2026-08-19.yml
  claim_boundary: >-
    The inventory proves only that exact client artifacts were installed and identified. It does not
    prove adapter generation, native discovery, effective permissions, runtime conformance, or owner
    admission; those states are evaluated and recorded independently.

policy:
  mapping_claim_only: true
  support_values:
    - supported
    - degraded
    - unmapped
    - forbidden
  projection_values:
    - native
    - compatible
    - transformed
    - none
  maturity_values:
    - ga
    - preview
    - beta
    - experimental
    - unspecified
  lifecycle_values:
    - current
    - legacy
    - deprecated
  adapter_strategy_values:
    - emit
    - import-wrapper
    - translate
    - omit
  lossiness_values:
    - none
    - bounded
    - material
  conformance_values:
    - not_run
    - passed
    - failed
    - expired
  admission_values:
    - research
    - candidate
    - admitted
    - denied
  generation_values:
    - not_implemented
    - candidate
    - implemented
  semantics:
    supported: A documented native or compatible surface exists with no identified semantic loss; runtime acceptance is separate.
    degraded: A safe projection may exist, but limitations and non-zero semantic loss must be declared.
    unmapped: No reliable projection exists; generation fails when the capability is required.
    forbidden: Enterprise policy prohibits the projection; generation and admission always fail.
  external_controls:
    - inference-profile resolution and provider/model admission
    - identity, credentials, secret brokerage, and data-loss prevention
    - filesystem sandbox and network egress enforcement
    - tool and MCP registry admission with pinned provenance
    - privileged and external-side-effect approval
    - CI rulesets, release signing, and deployment admission
  admission_rule: >-
    A tuple cannot be admitted if a required capability is unmapped or forbidden, a required mapping
    has material loss, any required conformance case is not passed, evidence is expired, or external
    policy denies the requested risk tier.
  requirement_semantics: >-
    A capability marked required below is the platform default. A manifest-level required rule,
    skill, command, tool, MCP registry, hook intent, permission, delegation, data, or evidence
    requirement can only strengthen that default and must be evaluated by the corresponding mapping.
    A required lifecycle intent may use a bounded degraded mapping only when the projection manifest
    records the omission and binds the intent to a mandatory fail-closed external control; an unmapped
    or instruction-only required lifecycle intent still fails generation.
  maturity_rule: >-
    Use ga only when an exact vendor release/version source explicitly labels the surface stable or GA.
    A documented surface without that evidence is unspecified and volatile.
  lifecycle_rule: >-
    current means the surface appears in the dated documentation snapshot; it is not a verified client
    version guarantee. A candidate mapping additionally requires an exact client version, source
    locator or digest, and real-runtime conformance evidence.
  state_boundary: >-
    Adapter generation status, installed-candidate evidence, runtime conformance, and owner admission
    are independent states. Implemented generation and an exact installed artifact do not change a
    not_run conformance result or research admission state.
  manifest_capability_bindings:
    mission.instructions_ref: custom-agents
    requirements.policies: permission-policy
    requirements.rules: project-instructions
    requirements.skills: agent-skills
    requirements.commands: reusable-commands
    requirements.hook_intents: lifecycle-hooks
    requirements.mcp: mcp-tools
    delegation: custom-agents
    permissions: permission-policy

capabilities:
  - id: project-instructions
    required: true
    intent: Discover project-wide canonical instructions with deterministic precedence.
  - id: path-scoped-rules
    required: true
    intent: Apply additional rules only to the intended repository paths.
  - id: agent-skills
    required: true
    intent: Discover reusable skill packages with instructions and bounded resources.
  - id: reusable-commands
    required: false
    intent: Expose explicit user-invoked workflow entry points without granting hidden authority.
  - id: custom-agents
    required: true
    intent: Define specialized agent roles, isolation, invocation, and delegation behavior.
  - id: lifecycle-hooks
    required: false
    intent: Bind semantic lifecycle intents to admitted client convenience hooks; authorization remains external.
  - id: mcp-tools
    required: true
    intent: Configure approved MCP capabilities through environment-resolved registry entries.
  - id: permission-policy
    required: true
    intent: Request least privilege while relying on external enforcement for durable prevention.

