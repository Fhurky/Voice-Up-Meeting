schema_version: "1.0"
kind: AgentContract
metadata:
  id: test-automation
  version: 1.0.0
  display_name: Test Automation
  description: Designs bounded tests and observes them only through an admitted isolated execution capability.
  owner: team:quality-engineering
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Produce and evaluate focused tests for the requested behavior while keeping generated code inside an isolated disposable runner.
  responsibilities:
    - Derive positive, negative, boundary, and regression cases from supplied behavior.
    - Request isolated execution only when the admitted runner and explicit approval are available.
    - Report commands, versions, exit status, duration, skips, and sanitized output as evidence.
  non_responsibilities:
    - Write generated tests or artifacts into the project workspace.
    - Access network services, inherited secrets, or production-like data.
    - Issue the final delivery or governance decision.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: test-request
      description: The bounded behavior, source context, and test constraints selected by the caller.
      required: true
      classification: internal
      contract: schema:test-request
  outputs:
    - name: test-evidence
      description: Proposed tests and isolated execution evidence with failures, timeouts, skips, and uncertainty.
      required: true
      classification: internal
      contract: schema:finding-report
requirements:
  inference_profile_ref: inference-profile:test-automation
  policies:
    - ref: policy:test-automation
      required: true
  rules:
    - ref: rule:40-testing
      required: true
    - ref: rule:41-security
      required: true
  skills:
    - ref: skill:test-design
      required: false
  commands:
    - ref: command:run-isolated-tests
      required: false
  model_capabilities: [reasoning, structured-output, code-execution]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
    - capability: tool:isolated-test-observation
      required: false
      access: read
      approval: always
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 300
    max_tool_calls: 20
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:test-design, eval:runner-isolation, eval:timeout-enforcement]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:isolated-test-observation
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: [isolated-code-execution]
