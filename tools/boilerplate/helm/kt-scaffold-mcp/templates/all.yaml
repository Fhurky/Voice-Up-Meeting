{{- define "kt-scaffold-mcp.fullname" -}}
{{- printf "%s" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{- define "kt-scaffold-mcp.labels" -}}
app.kubernetes.io/name: kt-scaffold-mcp
app.kubernetes.io/instance: {{ .Release.Name }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
app.kubernetes.io/part-of: kt-vibecoding-boilerplate
{{- end -}}

{{- define "kt-scaffold-mcp.selectorLabels" -}}
app.kubernetes.io/name: kt-scaffold-mcp
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}

{{- define "kt-scaffold-mcp.proxyConfig" -}}
server {
  listen {{ .Values.proxy.port }};
  server_name _;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location {{ .Values.mcp.path }} {
    proxy_pass http://127.0.0.1:{{ .Values.mcp.port }};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout {{ .Values.proxy.readTimeoutSeconds }}s;
    proxy_send_timeout {{ .Values.proxy.readTimeoutSeconds }}s;
    client_max_body_size {{ .Values.proxy.maxRequestBodySize }};
    proxy_set_header Host 127.0.0.1:{{ .Values.mcp.port }};
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
{{- end -}}

{{- define "kt-scaffold-mcp.proxyMainConfig" -}}
worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  sendfile on;
  keepalive_timeout 65;
  include /etc/nginx/conf.d/*.conf;
}
{{- end -}}

{{- $mcpRepository := required "mcp.image.repository is required" .Values.mcp.image.repository -}}
{{- $mcpDigest := required "mcp.image.digest is required" .Values.mcp.image.digest -}}
{{- $proxyRepository := required "proxy.image.repository is required" .Values.proxy.image.repository -}}
{{- $proxyDigest := required "proxy.image.digest is required" .Values.proxy.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $mcpDigest) -}}
{{- fail "mcp.image.digest must be an immutable sha256 digest" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $proxyDigest) -}}
{{- fail "proxy.image.digest must be an immutable sha256 digest" -}}
{{- end -}}
{{- if not (hasPrefix "/" .Values.mcp.path) -}}
{{- fail "mcp.path must be an absolute URL path" -}}
{{- end -}}
{{- if and .Values.ingress.enabled (empty .Values.ingress.host) -}}
{{- fail "ingress.host is required when ingress is enabled" -}}
{{- end -}}
{{- if and .Values.ingress.tls.enabled (empty .Values.ingress.tls.secretName) -}}
{{- fail "ingress.tls.secretName is required when ingress TLS is enabled" -}}
{{- end -}}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kt-scaffold-mcp.fullname" . }}
  labels:
    {{- include "kt-scaffold-mcp.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kt-scaffold-mcp.fullname" . }}-proxy
  labels:
    {{- include "kt-scaffold-mcp.labels" . | nindent 4 }}
data:
  nginx.conf: |
    {{- include "kt-scaffold-mcp.proxyMainConfig" . | nindent 4 }}
  default.conf: |
    {{- include "kt-scaffold-mcp.proxyConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kt-scaffold-mcp.fullname" . }}
  labels:
    {{- include "kt-scaffold-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "kt-scaffold-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kt-scaffold-mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: kt-vibecoding-boilerplate
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/proxy-config: {{ printf "%s\n%s" (include "kt-scaffold-mcp.proxyMainConfig" .) (include "kt-scaffold-mcp.proxyConfig" .) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kt-scaffold-mcp.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: "{{ $mcpRepository }}@{{ $mcpDigest }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          args:
            - mcp
            - --transport
            - streamable-http
            - --host
            - 127.0.0.1
            - --port
            - {{ .Values.mcp.port | quote }}
            - --path
            - {{ .Values.mcp.path | quote }}
          ports:
            - name: mcp-loopback
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          startupProbe:
            exec: &mcpProbe
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.mcp.port }}), 2).close()"
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec: *mcpProbe
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: *mcpProbe
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: scratch
              mountPath: /tmp
        - name: proxy
          image: "{{ $proxyRepository }}@{{ $proxyDigest }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          ports:
            - name: http
              containerPort: {{ .Values.proxy.port }}
              protocol: TCP
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          startupProbe:
            httpGet: &proxyProbe
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: *proxyProbe
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: *proxyProbe
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: proxy-cache
              mountPath: /var/cache/nginx
            - name: proxy-run
              mountPath: /var/run
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 32Mi
        - name: proxy-config
          configMap:
            name: {{ include "kt-scaffold-mcp.fullname" . }}-proxy
        - name: proxy-cache
          emptyDir:
            sizeLimit: 32Mi
        - name: proxy-run
          emptyDir:
            sizeLimit: 32Mi
        - name: proxy-tmp
          emptyDir:
            sizeLimit: 32Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kt-scaffold-mcp.fullname" . }}
  labels:
    {{- include "kt-scaffold-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kt-scaffold-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kt-scaffold-mcp.fullname" . }}
  labels:
    {{- include "kt-scaffold-mcp.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.proxy.maxRequestBodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.proxy.readTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.proxy.readTimeoutSeconds | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "kt-scaffold-mcp.fullname" . }}
                port:
                  name: http
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kt-scaffold-mcp.fullname" . }}
  labels:
    {{- include "kt-scaffold-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kt-scaffold-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        {{- if .Values.networkPolicy.allowSameNamespace }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.proxy.port }}
  egress: []
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kt-scaffold-mcp.fullname" . }}
  labels:
    {{- include "kt-scaffold-mcp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kt-scaffold-mcp.selectorLabels" . | nindent 6 }}
{{- end }}
