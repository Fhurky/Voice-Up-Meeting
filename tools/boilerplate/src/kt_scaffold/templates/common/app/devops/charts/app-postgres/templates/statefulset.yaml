apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: postgres}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: "{{ .Values.existingSecret }}", key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: "{{ .Values.existingSecret }}", key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: "{{ .Values.existingSecret }}", key: database}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          startupProbe: &probe
            exec: {command: ["sh", "-lc", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: {command: ["sh", "-lc", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            <<: *probe
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
