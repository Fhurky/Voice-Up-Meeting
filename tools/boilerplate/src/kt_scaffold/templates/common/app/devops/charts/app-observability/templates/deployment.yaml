apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-grafana"
  labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: grafana}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}@{{ .Values.grafana.image.digest }}"
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{secretRef: {name: "{{ .Values.grafana.existingSecret }}"}}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_SNAPSHOTS_EXTERNAL_ENABLED, value: "false"}
            - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
            - {name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED, value: "true"}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/platform-overview.json, subPath: platform-overview.json, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
          startupProbe: &grafanaProbe {httpGet: {path: /api/health, port: http}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 5}
          livenessProbe: *grafanaProbe
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - {name: provisioning, configMap: {name: "{{ .Release.Name }}-grafana-provisioning"}}
        - {name: data, emptyDir: {sizeLimit: 1Gi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
