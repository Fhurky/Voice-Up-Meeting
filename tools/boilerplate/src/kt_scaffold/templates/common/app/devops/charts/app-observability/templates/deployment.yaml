apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: observability}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: observability}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: observability}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}@{{ .Values.collector.image.digest }}"
          args: ["--config=/etc/otelcol/collector.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          startupProbe: &collectorProbe {httpGet: {path: /, port: health}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 5}
          livenessProbe: *collectorProbe
          resources: {{- toYaml .Values.collector.resources | nindent 12 }}
      volumes:
        - {name: config, configMap: {name: "{{ .Release.Name }}-collector-config"}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-tempo"
  labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: tempo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: tempo}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: tempo}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tempo
          image: "{{ .Values.tempo.image.repository }}@{{ .Values.tempo.image.digest }}"
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports: [{name: http, containerPort: 3200}, {name: otlp-grpc, containerPort: 4317}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo, readOnly: true}
            - {name: data, mountPath: /var/tempo}
          startupProbe: &tempoProbe {httpGet: {path: /ready, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          livenessProbe: *tempoProbe
          resources: {{- toYaml .Values.tempo.resources | nindent 12 }}
      volumes:
        - {name: config, configMap: {name: "{{ .Release.Name }}-tempo-config"}}
        - {name: data, emptyDir: {sizeLimit: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-prometheus"
  labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "@@PRODUCT_SLUG@@", app.kubernetes.io/component: prometheus}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}@{{ .Values.prometheus.image.digest }}"
          args: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver"]
          ports: [{name: http, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          startupProbe: &promProbe {httpGet: {path: /-/healthy, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 5}
          livenessProbe: *promProbe
          resources: {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - {name: config, configMap: {name: "{{ .Release.Name }}-prometheus-config"}}
        - {name: data, emptyDir: {sizeLimit: 2Gi}}
---
