# Active only on a bank-managed GitHub Enterprise instance whose Dependabot service can reach
# approved internal mirrors. Proposals remain input to dependency-admission.json and
# rules/54-dependency-currency.md; they never bypass the maturity gate.
# The 30-day cooldown applies to version updates only; security updates remain immediate.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src/kt_scaffold/templates/common/app/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      frontend-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/src/kt_scaffold/templates/common/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      e2e-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/src/kt_scaffold/templates/python-fastapi/app/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      backend-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      generator-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
