schema_version: "1.0"
kind: AgentContract
metadata:
  id: code-review
  version: 1.0.0
  display_name: Code Review
  description: Reviews a bounded change for concrete correctness, security, regression, and test risks.
  owner: team:developer-experience
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Return prioritized, evidence-backed findings for a bounded code change without editing or approving it.
  responsibilities:
    - Trace affected execution paths and applicable repository contracts.
    - Prioritize correctness, security, behavior regression, and missing-test findings.
    - Distinguish observed defects from hypotheses and validation gaps.
  non_responsibilities:
    - Modify source code, tests, configuration, or infrastructure.
    - Report style preferences without a material engineering impact.
    - Approve, merge, publish, or deploy a change.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: review-request
      description: The bounded diff and repository context selected for review.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: review-findings
      description: Prioritized findings with file evidence, impact, confidence, and validation gaps.
      required: true
      classification: internal
      contract: schema:finding-report
requirements:
  inference_profile_ref: inference-profile:code-review
  policies:
    - ref: policy:code-review
      required: true
  rules:
    - ref: rule:10-spec-first
      required: true
    - ref: rule:40-testing
      required: true
  skills:
    - ref: skill:repository-review
      required: false
  commands:
    - ref: command:review-pull-request
      required: false
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
    - capability: tool:test-observation
      required: false
      access: read
      approval: always
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:review-recall, eval:review-precision, eval:evidence-citation]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:read-only-review
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
