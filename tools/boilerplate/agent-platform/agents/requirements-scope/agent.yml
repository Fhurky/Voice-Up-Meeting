schema_version: "1.0"
kind: AgentContract
metadata:
  id: requirements-scope
  version: 1.0.0
  display_name: Requirements and Scope
  description: Clarifies requested scope and evaluates implementation traceability without approving delivery.
  owner: team:product-engineering
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Produce explicit, testable scope or evidence-backed traceability findings while preserving human ownership of requirements.
  responsibilities:
    - Identify ambiguities and request clarification before inventing scope.
    - Produce testable acceptance criteria for pre-development requests.
    - Report post-hoc requirement traceability gaps as findings.
  non_responsibilities:
    - Approve requirements or declare an agent-generated scope authoritative.
    - Modify code, specifications, policies, or external requirement systems.
    - Issue a release or governance decision.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: bounded-request
      description: A feature request or bounded implementation change and its applicable specification.
      required: true
      classification: internal
      contract: schema:requirements-request
  outputs:
    - name: requirements-assessment
      description: Clarifying questions, proposed acceptance criteria, or traceability findings with uncertainty.
      required: true
      classification: internal
      contract: schema:finding-report
requirements:
  inference_profile_ref: inference-profile:requirements-analysis
  policies:
    - ref: policy:requirements-scope
      required: true
  rules:
    - ref: rule:10-spec-first
      required: true
    - ref: rule:11-plan-driven
      required: true
  skills: []
  commands:
    - ref: command:clarify-requirements
      required: false
  model_capabilities: [reasoning, structured-output]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 600
    max_tool_calls: 30
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:ambiguity-handling, eval:scope-traceability, eval:evidence-citation]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:read-only-review
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
