apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: redis}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          command: ["sh", "-lc"]
          args: ["exec redis-server --save '' --appendonly no --requirepass \"$REDIS_PASSWORD\" --maxmemory {{ .Values.maxMemory }} --maxmemory-policy allkeys-lru"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: "{{ .Values.existingSecret }}", key: password}}
          ports:
            - {name: redis, containerPort: 6379}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe: &probe
            exec: {command: ["sh", "-lc", "redis-cli -a \"$REDIS_PASSWORD\" ping"]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["sh", "-lc", "redis-cli -a \"$REDIS_PASSWORD\" ping"]}
            periodSeconds: 5
          livenessProbe:
            <<: *probe
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
