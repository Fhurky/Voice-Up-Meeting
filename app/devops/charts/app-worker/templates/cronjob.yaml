apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: worker}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: worker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          command: {{ toJson .Values.command }}
          envFrom:
            - secretRef: {name: "{{ .Values.existingSecret }}"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: audio, mountPath: /data/audio}
          startupProbe:
            exec: {command: ["python", "-m", "app.scripts.speaker_worker", "--healthcheck"]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: ["python", "-m", "app.scripts.speaker_worker", "--healthcheck"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["python", "-m", "app.scripts.speaker_worker", "--healthcheck"]}
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: audio
          persistentVolumeClaim: {claimName: "{{ .Values.audioClaimName }}"}
