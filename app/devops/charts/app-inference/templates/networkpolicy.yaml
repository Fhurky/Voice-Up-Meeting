apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: inference}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: worker}
      ports: [{protocol: TCP, port: 8090}]
  egress: []
