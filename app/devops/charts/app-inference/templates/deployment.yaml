apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: inference}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: inference}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: inference}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: inference
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8090}
          env:
            - {name: HOME, value: /tmp}
            - {name: VOICEUP_INFERENCE_MODEL_DIR, value: /models/speaker}
            - {name: VOICEUP_INFERENCE_DEVICE, value: "cuda:0"}
            - {name: VOICEUP_INFERENCE_MAX_UPLOAD_BYTES, value: "52428800"}
            - {name: VOICEUP_INFERENCE_MAX_DURATION_SECONDS, value: "120"}
            - {name: VOICEUP_INFERENCE_HOST, value: "0.0.0.0"}
            - {name: VOICEUP_INFERENCE_PORT, value: "8090"}
          envFrom:
            - secretRef: {name: "{{ .Values.existingSecret }}"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: models, mountPath: /models/speaker, readOnly: true}
          startupProbe: &probe
            httpGet: {path: "/live", port: http}
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: "/ready", port: http}
            periodSeconds: 5
          livenessProbe:
            <<: *probe
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: "{{ .Values.modelStorage.claimName }}"}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
