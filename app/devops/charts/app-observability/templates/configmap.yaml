apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-collector-config"
data:
  collector.yaml: |
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    exporters:
      otlp/tempo:
        endpoint: {{ .Release.Name }}-tempo:4317
        tls: {insecure: true}
      prometheusremotewrite:
        endpoint: http://{{ .Release.Name }}-prometheus:9090/api/v1/write
      otlphttp/loki:
        endpoint: http://{{ .Release.Name }}-loki:3100/otlp
    service:
      extensions: [health_check]
      telemetry:
        metrics: {level: none}
        logs: {level: warn}
      pipelines:
        traces: {receivers: [otlp], exporters: [otlp/tempo]}
        metrics: {receivers: [otlp], exporters: [prometheusremotewrite]}
        logs: {receivers: [otlp], exporters: [otlphttp/loki]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-tempo-config"
data:
  tempo.yaml: |
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: 0.0.0.0:4317}
    storage:
      trace:
        backend: local
        local: {path: /var/tempo/traces}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-prometheus-config"
data:
  prometheus.yaml: |
    global: {scrape_interval: 15s}
    scrape_configs:
      - job_name: prometheus
        static_configs: [{targets: ["localhost:9090"]}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-loki-config"
data:
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-grafana-provisioning"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://{{ .Release.Name }}-prometheus:9090", isDefault: true, editable: false}
      - {name: Loki, uid: loki, type: loki, access: proxy, url: "http://{{ .Release.Name }}-loki:3100", editable: false}
      - {name: Tempo, uid: tempo, type: tempo, access: proxy, url: "http://{{ .Release.Name }}-tempo:3200", editable: false}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: platform
        folder: Platform
        type: file
        disableDeletion: true
        editable: false
        options: {path: /var/lib/grafana/dashboards}
  platform-overview.json: |
    {"annotations":{"list":[]},"editable":false,"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"targets":[{"expr":"up","refId":"A"}],"title":"Local telemetry targets","type":"timeseries"}],"schemaVersion":42,"tags":["generated","offline"],"title":"Platform overview","uid":"platform-overview","version":1}
