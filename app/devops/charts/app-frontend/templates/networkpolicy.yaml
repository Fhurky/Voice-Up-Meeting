apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: "voiceup", app.kubernetes.io/component: frontend}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: "{{ .Values.ingress.controllerNamespace }}"}
          podSelector:
            matchLabels: {app.kubernetes.io/name: "{{ .Values.ingress.controllerComponent }}"}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
