# Only the Spark host loopback port is published. The inference process remains
# on its internal bridge; Docker DNS refresh supports replacement containers.
server {
  listen 8090;
  server_name _;
  access_log off;
  client_max_body_size 51m;
  client_body_timeout 30s;

  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  set $inference_origin http://inference:8090;

  proxy_http_version 1.1;
  proxy_set_header Host $proxy_host;
  proxy_set_header Connection "";
  proxy_set_header Upgrade "";
  proxy_set_header X-Inference-Key $http_x_inference_key;
  proxy_set_header X-Job-Id $http_x_job_id;
  proxy_set_header X-Tenant-Id $http_x_tenant_id;
  proxy_connect_timeout 3s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_next_upstream off;

  location = /ready {
    if ($request_method != GET) { return 405; }
    proxy_pass $inference_origin;
  }

  location = /v1/embeddings {
    if ($request_method != POST) { return 405; }
    proxy_pass $inference_origin;
  }

  location = /meeting-ready {
    if ($request_method != GET) { return 405; }
    proxy_pass $inference_origin;
  }

  location = /v1/meeting-chunks {
    if ($request_method != POST) { return 405; }
    client_max_body_size 120m;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_pass $inference_origin;
  }

  location = /v1/meeting-memory {
    if ($request_method != POST) { return 405; }
    client_max_body_size 36m;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_pass $inference_origin;
  }

  location / {
    return 404;
  }
}
