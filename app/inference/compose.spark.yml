# Copy beside the verified models directory on Spark. Supply only the two values
# in .env.spark.example through a private --env-file; never copy the web .env.
name: voiceup-spark

services:
  inference:
    image: ${SPARK_INFERENCE_IMAGE:?Set the verified immutable Spark image ID}
    platform: linux/arm64
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    devices: ["nvidia.com/gpu=0"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=536870912"]
    environment:
      VOICEUP_INFERENCE_INTERNAL_KEY: ${INFERENCE_INTERNAL_KEY:?Set the private inference key}
      VOICEUP_INFERENCE_MODEL_DIR: /models/speaker
      VOICEUP_INFERENCE_DEVICE: cuda:0
      VOICEUP_INFERENCE_RUNTIME_PROFILE: aarch64-cu129
      VOICEUP_INFERENCE_HOST: 0.0.0.0
      VOICEUP_INFERENCE_PORT: "8090"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      CUDA_CACHE_PATH: /tmp/cuda
    volumes:
      - type: bind
        source: ./models/speaker-pilot
        target: /models/speaker
        read_only: true
        bind:
          create_host_path: false
    networks: [inference]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3).close()"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Docker does not publish ports from an internal-only bridge. Only this relay
  # joins edge; the model has no external network, published port or DNS egress.
  relay:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    platform: linux/arm64
    pull_policy: never
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=16777216,mode=1777
      - /var/run:rw,nosuid,nodev,size=1048576,mode=1777
      - /tmp:rw,nosuid,nodev,size=16777216,mode=1777
    volumes:
      - type: bind
        source: ./nginx.spark.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    ports: ["127.0.0.1:8090:8090"]
    networks: [inference, edge]
    dns: [127.0.0.1]
    depends_on:
      inference:
        condition: service_healthy

networks:
  inference:
    driver: bridge
    internal: true
  edge:
    driver: bridge
