# This listener is reachable only inside Docker; it has no published host port.
# Windows SSH binds 127.0.0.1:18090 and forwards to Spark's loopback model service.
# start-spark-proxy.sh replaces the host alias with its unique Docker IPv4 in tmpfs.
server {
  listen 9080;
  server_name _;
  access_log off;
  client_max_body_size 51m;
  client_body_timeout 30s;

  proxy_http_version 1.1;
  proxy_set_header Host $proxy_host;
  proxy_set_header Connection "";
  proxy_set_header Upgrade "";
  proxy_set_header X-Inference-Key $http_x_inference_key;
  proxy_set_header X-Job-Id $http_x_job_id;
  proxy_set_header X-Tenant-Id $http_x_tenant_id;
  proxy_connect_timeout 3s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_next_upstream off;

  location = /ready {
    if ($request_method != GET) { return 405; }
    proxy_pass http://voiceup-spark-host:18090;
  }

  location = /v1/embeddings {
    if ($request_method != POST) { return 405; }
    proxy_pass http://voiceup-spark-host:18090;
  }

  location = /meeting-ready {
    if ($request_method != GET) { return 405; }
    proxy_pass http://voiceup-spark-host:18090;
  }

  location = /v1/meeting-chunks {
    if ($request_method != POST) { return 405; }
    client_max_body_size 120m;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_pass http://voiceup-spark-host:18090;
  }

  location = /v1/meeting-memory {
    if ($request_method != POST) { return 405; }
    client_max_body_size 36m;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_pass http://voiceup-spark-host:18090;
  }

  location / {
    return 404;
  }
}
